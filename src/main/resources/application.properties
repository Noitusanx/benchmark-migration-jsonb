spring.main.web-application-type=none
spring.main.banner-mode=off
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55434/jsonb_migration_lab?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USER:lab}
spring.datasource.password=${DB_PASSWORD:lab_only}
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=${WRITE_BATCH_SIZE:100}
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.root=WARN
bench.enabled=true
